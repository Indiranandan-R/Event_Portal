<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoreX — Event Automation Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --bg:#0B0F14; --panel:#111823; --panel-2:#161F2C; --line:#233042;
  --ink:#E7EDF4; --ink-dim:#8FA0B3; --ink-faint:#5B6C80;
  --teal:#4CE0C6; --teal-dim:#2A8F7D; --violet:#A78BFA;
  --amber:#F5B85B; --red:#F0796B; --green:#57D18B;
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --radius:10px; --radius-lg:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--teal); color:#04140F;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
#app{min-height:100vh; position:relative; z-index:1;}

/* ---------- Animated motion background ---------- */
.bg-motion{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:var(--bg);}
.bg-motion::before{
  content:""; position:absolute; inset:-10%;
  background-image:
    linear-gradient(rgba(76,224,198,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(76,224,198,.07) 1px, transparent 1px);
  background-size:42px 42px;
  animation:bgGridDrift 26s linear infinite;
}
.bg-blob{position:absolute; border-radius:50%; filter:blur(80px); opacity:.5; will-change:transform;}
.bg-blob-1{width:560px;height:560px; top:-160px; left:-140px; background:radial-gradient(circle at 30% 30%, var(--teal), transparent 70%); animation:bgFloat1 16s ease-in-out infinite;}
.bg-blob-2{width:500px;height:500px; top:25%; right:-180px; background:radial-gradient(circle at 60% 40%, var(--violet), transparent 70%); animation:bgFloat2 20s ease-in-out infinite;}
.bg-blob-3{width:460px;height:460px; bottom:-180px; left:20%; background:radial-gradient(circle at 50% 50%, var(--amber), transparent 70%); opacity:.32; animation:bgFloat3 24s ease-in-out infinite;}
.bg-blob-4{width:380px;height:380px; top:55%; left:45%; background:radial-gradient(circle at 50% 50%, var(--green), transparent 70%); opacity:.26; animation:bgFloat4 19s ease-in-out infinite;}
.bg-blob-5{width:340px;height:340px; top:5%; left:50%; background:radial-gradient(circle at 50% 50%, var(--teal), transparent 70%); opacity:.22; animation:bgFloat5 22s ease-in-out infinite;}
@keyframes bgGridDrift{from{transform:translate(0,0);} to{transform:translate(42px,42px);}}
@keyframes bgFloat1{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(120px,140px) scale(1.2);}
}
@keyframes bgFloat2{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-150px,100px) scale(1.15);}
}
@keyframes bgFloat3{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(90px,-120px) scale(1.25);}
}
@keyframes bgFloat4{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-100px,-90px) scale(1.18);}
}
@keyframes bgFloat5{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(80px,110px) scale(1.1);}
}
@media (prefers-reduced-motion: reduce){
  .bg-motion::before, .bg-blob-1, .bg-blob-2, .bg-blob-3, .bg-blob-4, .bg-blob-5{animation:none;}
}
#bg-particles{position:absolute; inset:0; width:100%; height:100%; display:block;}
.container{max-width:1180px; margin:0 auto; padding:0 28px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#243141;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .12s ease, background .15s ease, border-color .15s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--teal); color:#05201A;}
.btn-primary:hover{background:#65E8D1;}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--teal-dim); color:var(--teal);}
.btn-violet{background:var(--violet);color:#1B0F3D;}
.btn-violet:hover{background:#B7A2FC;}
.btn-danger{background:transparent;color:var(--red);border-color:#4a2a27;}
.btn-danger:hover{background:#2a1614;}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
input,select,textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  padding:10px 13px;border-radius:8px;font-family:inherit;font-size:14.5px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--teal-dim);}
label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;font-weight:600;}
.field{margin-bottom:15px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.grid2{grid-template-columns:1fr;}}
.hint{font-size:12px;color:var(--ink-faint);margin-top:5px;}

/* ---------- Landing ---------- */
.nav{position:sticky;top:0;z-index:40;background:rgba(11,15,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-row{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:700;font-size:19px;}
.brand-mark{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,var(--teal),var(--violet),var(--teal));display:flex;align-items:center;justify-content:center;color:#05100C;font-size:14px;font-weight:800;}
.brand-logo{height:32px;width:auto;display:block;}
.brand-logo-lg{height:38px;width:auto;display:block;}
.brand-name{color:#FFFFFF;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.01em;}
.brand-name-lg{color:#FFFFFF;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;}
.nav-links{display:flex;gap:26px;align-items:center;}
.nav-links a{font-size:14px;color:var(--ink-dim);}
.nav-links a:hover{color:var(--ink);}

.hero{padding:86px 28px 60px;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
@media(max-width:920px){.hero{grid-template-columns:1fr;padding-top:56px;}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-size:13px;font-weight:600;margin-bottom:18px;}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.08;font-weight:700;}
.hero p.lead{color:var(--ink-dim);font-size:17.5px;line-height:1.6;margin:20px 0 30px;max-width:46ch;}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;}
.pipeline{position:relative;}
.pipeline img{display:block;width:100%;max-width:900px;height:auto;border-radius:10px;}
.pipe-node{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink);}
.pipe-node .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.pipe-arrow{color:var(--ink-faint);font-size:12px;padding-left:22px;margin:1px 0;}

.stats-bar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.stats-row{max-width:1180px;margin:0 auto;padding:34px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media(max-width:760px){.stats-row{grid-template-columns:1fr 1fr;}}
.stat-num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--teal);}
.stat-label{color:var(--ink-dim);font-size:13px;margin-top:4px;}

.section{padding:78px 28px;max-width:1180px;margin:0 auto;}
.section-head{max-width:56ch;margin-bottom:40px;}
.section-head h2{font-size:30px;font-weight:700;}
.section-head p{color:var(--ink-dim);margin-top:10px;font-size:15.5px;}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:860px){.feat-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.feat-grid{grid-template-columns:1fr;}}
.feat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;}
.feat-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px;}
.feat-card h3{font-size:16.5px;margin-bottom:7px;}
.feat-card p{color:var(--ink-dim);font-size:13.8px;line-height:1.55;margin:0;}

.flow-strip{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;}
.flow-strip img{display:block;width:100%;max-width:900px;height:auto;border-radius:10px;}
.flow-step{display:flex;align-items:center;gap:10px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink);}
.flow-sep{color:var(--ink-faint);}

footer{border-top:1px solid var(--line);padding:44px 28px 30px;}
.foot-row{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;}
.foot-links{display:flex;gap:22px;flex-wrap:wrap;}
.foot-links a{font-size:13.5px;color:var(--ink-dim);}
.foot-links a:hover{color:var(--teal);}
.foot-copy{color:var(--ink-faint);font-size:12.5px;margin-top:20px;}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;}
.auth-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:34px;}
.role-tabs{display:flex;gap:6px;background:var(--panel-2);padding:4px;border-radius:9px;margin-bottom:22px;}
.role-tab{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--ink-dim);}
.role-tab.active{background:var(--teal);color:#05201A;}
.demo-creds{background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--ink-dim);margin-top:14px;line-height:1.7;}
.demo-creds b{color:var(--ink);}

/* ---------- App shell (dashboards) ---------- */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
@media(max-width:900px){.shell{grid-template-columns:1fr;}}
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
@media(max-width:900px){.sidebar{display:none;}.sidebar.open{display:block;position:fixed;z-index:60;width:236px;}}
.side-brand{display:flex;align-items:center;gap:9px;padding:6px 10px 22px;font-family:var(--font-display);font-weight:700;}
.side-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin:16px 10px 6px;font-weight:700;}
.side-link{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:var(--ink-dim);font-size:14px;font-weight:500;cursor:pointer;margin-bottom:2px;}
.side-link:hover{background:var(--panel-2);color:var(--ink);}
.side-link.active{background:rgba(76,224,198,.12);color:var(--teal);}
.side-link .ico{width:17px;text-align:center;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:15px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.topbar h2{font-size:19px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.avatar{width:33px;height:33px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--teal);}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 10px;}
@media(max-width:900px){.menu-btn{display:block;}}
.page-pad{padding:24px 26px 60px;}

/* cards & tables */
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
@media(max-width:1000px){.cards4{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.cards4{grid-template-columns:1fr;}}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;}
.stat-card .n{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-card .l{color:var(--ink-dim);font-size:12.8px;margin-top:4px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;margin-bottom:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.card-head h3{font-size:16px;}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13.6px;}
th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);}
td{padding:11px 10px;border-bottom:1px solid #1a2532;color:var(--ink);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.table-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.table-toolbar input,.table-toolbar select{width:auto;min-width:150px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
.b-pending{background:rgba(245,184,91,.13);color:var(--amber);}
.b-verified,.b-approved,.b-present,.b-open,.b-valid,.b-completed,.b-generated{background:rgba(87,209,139,.13);color:var(--green);}
.b-rejected{background:rgba(240,121,107,.13);color:var(--red);}
.b-rejected,.b-absent,.b-cancelled,.b-invalid{background:rgba(240,121,107,.13);color:var(--red);}
.b-draft,.b-closed,.b-ongoing{background:rgba(143,160,179,.13);color:var(--ink-dim);}
.b-winner{background:rgba(245,184,91,.15);color:var(--amber);}
.b-runner1{background:rgba(167,139,250,.15);color:var(--violet);}
.b-runner2{background:rgba(76,224,198,.15);color:var(--teal);}
.award-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.award-row select{width:auto;min-width:148px;padding:7px 10px;font-size:13px;}

.empty{text-align:center;padding:44px 20px;color:var(--ink-faint);}
.empty .big{font-size:30px;margin-bottom:10px;}

/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(5,8,11,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-close{cursor:pointer;color:var(--ink-faint);font-size:20px;background:none;border:none;}
.toast-wrap{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:9px;padding:12px 16px;font-size:13.6px;min-width:240px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:slidein .25s ease;}
.toast.err{border-left-color:var(--red);}
@keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tab{padding:10px 16px;font-size:13.8px;font-weight:600;color:var(--ink-dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--teal);border-color:var(--teal);}

.qr-box{background:#fff;padding:14px;border-radius:12px;display:inline-block;}
.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;padding-bottom:22px;position:relative;}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line);}
.tl-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--panel-2);border:2px solid var(--line);color:var(--ink-faint);}
.tl-dot.done{background:var(--green);border-color:var(--green);color:#06210F;}
.tl-title{font-weight:600;font-size:13.8px;}
.tl-sub{font-size:12px;color:var(--ink-faint);margin-top:1px;}

.evt-cover{height:120px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:center;font-size:34px;background-size:cover;background-position:center;}
.evt-cover-icon{width:56px;height:56px;border-radius:50%;background:rgba(9,13,18,0.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;font-size:28px;}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.event-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;}
.event-block-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.event-block-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-dim);gap:10px;}
.event-block-row b{color:var(--ink);font-weight:600;font-size:13px;text-align:right;}
.event-block-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);}
.evt-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;}
.evt-body{padding:16px;flex:1;display:flex;flex-direction:column;gap:8px;}
.evt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:900px){.evt-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.evt-grid{grid-template-columns:1fr;}}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;}
.chart-box{position:relative;height:230px;}
.star-row{display:flex;gap:4px;font-size:20px;cursor:pointer;}
.star{color:var(--line);}
.star.on{color:var(--amber);}
.notif-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #1a2532;}
.notif-item:last-child{border-bottom:none;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);margin-top:6px;flex-shrink:0;}
.notif-item.read .notif-dot{background:var(--line);}
.scan-panel{max-width:460px;margin:0 auto;text-align:center;}
.scan-cam{background:var(--panel-2);border:2px dashed var(--line);border-radius:16px;height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-faint);margin-bottom:18px;position:relative;overflow:hidden;}
.scan-cam video{width:100%;height:100%;object-fit:cover;border-radius:14px;display:none;}
.scan-cam.active video{display:block;}
.scan-cam.active .scan-cam-placeholder{display:none;}
.scan-frame{position:absolute;inset:14%;border:2px solid var(--teal);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none;display:none;}
.scan-cam.active .scan-frame{display:block;}
.scan-status{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:4px 0;display:none;}
.scan-cam.active .scan-status{display:block;}
.scan-divider{display:flex;align-items:center;gap:10px;color:var(--ink-faint);font-size:12px;margin:16px 0;}
.scan-divider::before,.scan-divider::after{content:"";flex:1;height:1px;background:var(--line);}
.result-panel{border-radius:14px;padding:20px;margin-top:16px;text-align:left;}
.result-ok{background:rgba(87,209,139,.08);border:1px solid rgba(87,209,139,.3);}
.result-bad{background:rgba(240,121,107,.08);border:1px solid rgba(240,121,107,.3);}
.kv-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.06);}
.kv-row:last-child{border-bottom:none;}
.kv-row b{color:var(--ink);}
.certificate-canvas-wrap{display:flex;justify-content:center;overflow-x:auto;}

/* ---------- Communication center ---------- */
.side-count{margin-left:auto;background:var(--teal);color:#05201A;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;}
.comm-seg{display:inline-flex;gap:4px;background:var(--panel-2);padding:4px;border-radius:9px;margin-bottom:18px;flex-wrap:wrap;}
.comm-seg .seg{padding:7px 15px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--ink-dim);}
.comm-seg .seg:hover{color:var(--ink);}
.comm-seg .seg.active{background:var(--teal);color:#05201A;}
.file-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.file-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;font-size:12.5px;color:var(--ink);font-family:inherit;}
button.file-dl{cursor:pointer;}
button.file-dl:hover{border-color:var(--teal-dim);color:var(--teal);}
.file-x{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:16px;padding:0 0 0 2px;line-height:1;}
.file-x:hover{color:var(--red);}
.ph-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.ph{font-family:var(--font-mono);font-size:11.5px;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;}
.ph:hover{border-color:var(--teal-dim);color:var(--teal);}
.check-row{display:flex;gap:18px;flex-wrap:wrap;}
.check-row label{display:flex;align-items:center;gap:7px;margin:0;font-size:13.5px;color:var(--ink);cursor:pointer;}
.check-row input{width:auto;}
.chan{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);margin:0 4px 4px 0;}
.b-delivered{background:rgba(143,160,179,.13);color:var(--ink-dim);}
.b-read{background:rgba(87,209,139,.13);color:var(--green);}
.inbox{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
@media(max-width:820px){.inbox{grid-template-columns:1fr;}}
.inbox-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;max-height:620px;overflow-y:auto;}
.th-item{padding:13px 15px;border-bottom:1px solid #1a2532;cursor:pointer;}
.th-item:last-child{border-bottom:none;}
.th-item:hover{background:var(--panel-2);}
.th-item.active{background:rgba(76,224,198,.09);box-shadow:inset 3px 0 0 var(--teal);}
.th-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.th-title{font-weight:600;font-size:14px;}
.th-snip{font-size:12.5px;color:var(--ink-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.th-unread{background:var(--teal);color:#05201A;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;}
.inbox-pane{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:440px;}
.pane-head{padding:14px 18px;border-bottom:1px solid var(--line);}
.pane-body{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:460px;overflow-y:auto;flex:1;}
.pane-reply{border-top:1px solid var(--line);padding:12px 14px;}
.msg{max-width:78%;border-radius:12px;padding:10px 13px;font-size:13.8px;line-height:1.55;border:1px solid var(--line);background:var(--panel-2);}
.msg.mine{align-self:flex-end;background:rgba(76,224,198,.10);border-color:rgba(76,224,198,.28);}
.msg.theirs{align-self:flex-start;}
.msg.sys{align-self:center;max-width:90%;background:transparent;border-style:dashed;color:var(--ink-dim);}
.msg-who{font-size:12px;font-weight:600;color:var(--teal);margin-bottom:3px;}
.msg-who span{color:var(--ink-faint);font-weight:500;margin-left:6px;}
.msg.sys .msg-who{color:var(--ink-faint);}
.msg-sub{font-weight:600;margin-bottom:3px;}
.msg-text{white-space:pre-wrap;word-break:break-word;}
.msg-meta{font-size:11.5px;color:var(--ink-faint);margin-top:6px;text-align:right;}
</style>
</head>

/* Only login accounts are seeded. No events, registrations, attendance,
   feedback, certificates or audit history are pre-created — every number
   on the dashboard reflects only what is actually created/registered in
   the app from here on. */
function seed(){
  const users = [
    {id:'u_admin', name:'Meera Admin', email:'admin@demo.com', password:'admin123', role:'admin'},
    {id:'u_staff', name:'Kabir Coordinator', email:'staff@demo.com', password:'staff123', role:'staff'},
    {id:'u_p1', name:'Arun Kumar', email:'arun@demo.com', password:'demo123', role:'participant'},
  ];
  const events = [];
  const regs=[], att=[], fb=[], certs=[], messages=[], templates=[], files={}, audit=[], counter=1;

  return {users, events, regs, att, fb, certs, messages, templates, files, audit, counter};
}

/* Adds the communication tables to older saved data and folds the old
   notification list into the new central message store. */
function migrateDB(d){
  d.messages = d.messages || []; d.templates = d.templates || []; d.files = d.files || {};
  if(Array.isArray(d.notifs)){
    d.notifs.forEach(n=>{
      const ev = (d.events||[]).find(e=> e.name && String(n.message||'').includes(e.name));
      d.messages.push({id:n.id, batchId:n.id, eventId: ev?ev.id:'', senderId:null, senderRole:'system', recipientId:n.userId,
        kind:'system', direct:false, subject:'', body:n.message, files:[], channels:['in_app'],
        status:n.read?'read':'delivered', readAt:n.read?n.createdAt:null, createdAt:n.createdAt,
        threadKey:'p:'+(ev?ev.id:'general')+':'+n.userId});
    });
    delete d.notifs;
  }
  return d;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrateDB(JSON.parse(raw));
  }catch(e){}
  const s = seed();
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  return s;
}
let DB = loadDB();
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }

}
function resetDemo(){ DB = seed(); save(); toast('Demo data has been reset.'); navigate('#/'); }

/* Pulls individual team-member names for certificate generation. Prefers
   whatever the team typed into name-style feedback questions (e.g. "Team
   Member1 Name"), since that's the record organizers actually see per
   event; falls back to the structured member list captured at
   registration if the feedback form doesn't carry names. The team
   leader's own name is excluded — the leader already gets the primary
   certificate — and duplicates are dropped. */
function certRosterNames(ev, r){
  const names = [];
  const fb = fbForReg(r.id);
  if(fb && fb.answers){
    getFeedbackForm(ev).forEach(q=>{
      const label = (q.label||'').toLowerCase();
      if(!/member/.test(label) || !/name/.test(label)) return;
      const val = (fb.answers[q.id]||'').toString().trim();
      if(val) names.push(val);
    });
  }
  if(!names.length && r.teamMembersList && r.teamMembersList.length){
    r.teamMembersList.forEach(m=>{ if(m && m.name) names.push(m.name); });
  }
  const u = userById(r.userId);
  const leaderKey = (r.teamLeader || (u?u.name:'') || '').trim().toLowerCase();
  const seen = new Set();
  return names.filter(n=>{
    const key = n.trim().toLowerCase();
    if(!key || key===leaderKey || seen.has(key)) return false;
    seen.add(key); return true;
  });
}
function badgeClass(s){ return 'b-'+String(s).toLowerCase().replace(/\s+/g,'-'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Auto-generated event cover art: a unique gradient + abstract shape pattern
   derived from the event's code/name, so every event gets its own distinct
   visual with zero network calls (works fully offline, no API key needed). */
function hashStr(s){ let h=0; s=String(s||''); for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function seededRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }
const COVER_PALETTES = [
  ['#4CE0C6','#0B7A6C'],['#A78BFA','#4C1D95'],['#F5B85B','#92400E'],
  ['#60A5FA','#1E3A8A'],['#F472B6','#831843'],['#57D18B','#14532D'],
  ['#38BDF8','#0C4A6E'],['#FB923C','#7C2D12'],['#C084FC','#581C87']
];
function eventCoverSVG(ev){
  const key = (ev.code||ev.id||ev.name||'event');
  const h = hashStr(key);
  const [c1,c2] = COVER_PALETTES[h % COVER_PALETTES.length];
  const angle = h % 360;
  let shapes = '';
  for(let i=0;i<5;i++){
    const r = 24 + seededRand(h*0.7+i*3.1)*64;
    const cx = seededRand(h*1.3+i*5.7)*400;
    const cy = seededRand(h*2.1+i*7.9)*160;
    const op = (0.08 + seededRand(h*3.3+i*2.2)*0.16).toFixed(2);
    shapes += `<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${r.toFixed(0)}" fill="#fff" opacity="${op}"/>`;
  }
  for(let i=0;i<3;i++){
    const x1 = seededRand(h*4.1+i).toFixed(0)*400, y1=0, x2=seededRand(h*5.3+i).toFixed(0)*400, y2=160;
    shapes += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160">
    <defs><linearGradient id="g${h}" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(${angle} 0.5 0.5)">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <rect width="400" height="160" fill="url(#g${h})"/>${shapes}
  </svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

function openModal(html){
  closeModal();

  ov.className='overlay'; ov.id='modalOverlay';

  document.body.appendChild(ov);
}

function currentRoute(){
  const h = location.hash || '#/';
  const parts = h.replace('#/','').split('/').filter(Boolean);
  return parts;
}
function requireRole(role){
  const s = getSession();
  if(!s || s.role!==role){ navigate('#/login'); return null; }
  return s;
}

  window.scrollTo(0,0);

  if(!root) return app.innerHTML = pageLanding();
  if(root==='login') return app.innerHTML = pageLogin();
  if(root==='signup') return app.innerHTML = pageSignup();
  if(root==='verify-certificate') return app.innerHTML = pageVerifyCert();
  if(root==='admin'){ const s=requireRole('admin'); if(!s) return; return renderShell('admin', parts, s); }
  if(root==='staff'){ const s=requireRole('staff'); if(!s) return; return renderShell('staff', parts, s); }
  if(root==='participant'){ const s=requireRole('participant'); if(!s) return; return renderShell('participant', parts, s); }
  app.innerHTML = pageLanding();
}

function drawRegChart(){
  const el = document.getElementById('regChart'); if(!el || !window.Chart) return;
  const byDay = {};
  DB.regs.forEach(r=>{ const d = r.createdAt.slice(0,10); byDay[d]=(byDay[d]||0)+1; });
  let labels = Object.keys(byDay).sort();
  if(labels.length===0) labels=[nowISO().slice(0,10)];
  new Chart(el, {type:'line', data:{labels, datasets:[{label:'Registrations', data:labels.map(d=>byDay[d]||0), borderColor:'#4CE0C6', backgroundColor:'rgba(76,224,198,.15)', fill:true, tension:.35}]},
    options:baseChartOpts()});
}
function drawAttChart(){
  const el = document.getElementById('attChart'); if(!el || !window.Chart) return;
  const registered = DB.regs.length;
  const verified = DB.regs.filter(r=>r.status==='approved').length;
  const present = DB.att.length;
  const absent = Math.max(verified-present,0);
  new Chart(el, {type:'bar', data:{labels:['Registered','Verified','Present','Absent'], datasets:[{data:[registered,verified,present,absent], backgroundColor:['#4CE0C6','#A78BFA','#57D18B','#F0796B'], borderRadius:6}]},
    options:{...baseChartOpts(), plugins:{legend:{display:false}}}});
}
function baseChartOpts(){
  return {responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{color:'#8FA0B3'}}},
    scales:{x:{ticks:{color:'#8FA0B3'},grid:{color:'#1a2532'}}, y:{ticks:{color:'#8FA0B3'},grid:{color:'#1a2532'},beginAtZero:true}}};
}

              <button class="btn btn-danger btn-sm" data-del-event="${e.id}">Delete</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>` : `<div class="card">${emptyState('🗓️','No events yet','Create your first event to get started.')}</div>`}
  `;
}

        <label>Auto-Generated Payment QR Preview</label>
        <div style="display:flex;align-items:center;gap:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px;">
          <div id="ef_qr_preview" class="qr-box" style="width:120px;height:120px;flex-shrink:0;"></div>
          <div class="hint" style="margin:0;">No QR image uploaded above, so a QR code is generated automatically from the payment info and fee, and will be shown to participants when they register.</div>

    const feeEl = document.getElementById('ef_fee');
    const payEl = document.getElementById('ef_payinfo');
    const wrap = document.getElementById('ef_qr_wrap');
    const preview = document.getElementById('ef_qr_preview');
    const imgWrap = document.getElementById('ef_qr_img_preview');
    const uploadEl = document.getElementById('ef_qr_upload');
    const removeBtn = document.getElementById('ef_qr_remove');
    let qrImageData = ev.paymentQRImage || '';
    window._ef_getQRImage = () => qrImageData;
    function refreshQR(){
      const fee = parseFloat(feeEl.value||'0');
      const info = payEl.value.trim();
      if(qrImageData){
        wrap.style.display='none';
      } else if(fee>0 && info){
        wrap.style.display='';
        preview.innerHTML='';
        new QRCode(preview, {text: 'upi://pay?pa='+encodeURIComponent(info)+'&am='+fee+'&cu=INR&tn='+encodeURIComponent(ev.code||'Registration'), width:120, height:120, colorDark:'#0B0F14', colorLight:'#ffffff'});
      } else {
        wrap.style.display='none';
      }
    }
    feeEl.addEventListener('input', refreshQR);
    payEl.addEventListener('input', refreshQR);
    uploadEl.addEventListener('change', ()=>{
      const file = uploadEl.files && uploadEl.files[0];
      if(!file) return;
      if(!file.type.startsWith('image/')){ toast('Please choose an image file.','err'); return; }
      if(file.size > 3*1024*1024){ toast('Image too large (max 3MB).','err'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        qrImageData = reader.result;
        imgWrap.style.display='flex'; imgWrap.style.alignItems='center'; imgWrap.style.justifyContent='center';
        imgWrap.innerHTML = `<img src="${qrImageData}" style="max-width:100%;max-height:100%;">`;
        removeBtn.style.display='';
        refreshQR();
      };
      reader.readAsDataURL(file);
    });
    removeBtn.addEventListener('click', ()=>{
      qrImageData = '';
      imgWrap.style.display='none'; imgWrap.innerHTML='';
      uploadEl.value=''; removeBtn.style.display='none';
      refreshQR();
    });
    refreshQR();
  })();
  document.getElementById('eventForm').addEventListener('submit', e=>{
    e.preventDefault();
    const teamMin = parseInt(document.getElementById('ef_teammin').value||'1',10) || 1;
    const teamMax = parseInt(document.getElementById('ef_teammax').value||'1',10) || 1;
    if(teamMax < teamMin){ toast('Max team size cannot be less than min team size.','err'); return; }
    const data = {
      name:document.getElementById('ef_name').value.trim(), code:document.getElementById('ef_code').value.trim(),
      description:document.getElementById('ef_desc').value.trim(), category:document.getElementById('ef_cat').value.trim(),
      status:document.getElementById('ef_status').value, date:document.getElementById('ef_date').value,
      venue:document.getElementById('ef_venue').value.trim(), mode:document.getElementById('ef_mode').value,
      teamMin, teamMax,
      startTime:document.getElementById('ef_start').value,
      endTime:document.getElementById('ef_end').value, regStart:document.getElementById('ef_regstart').value,
      regDeadline:document.getElementById('ef_regdead').value, organizer:document.getElementById('ef_org').value.trim(),
      capacity:parseInt(document.getElementById('ef_cap').value||'0',10), speaker:document.getElementById('ef_speaker').value.trim(),
      icon:document.getElementById('ef_icon').value.trim()||'🎯', speakerInfo:document.getElementById('ef_speakerinfo').value.trim(),
      fee: parseFloat(document.getElementById('ef_fee').value||'0')||0, paymentInfo: document.getElementById('ef_payinfo').value.trim(),
      paymentQRImage: (window._ef_getQRImage ? window._ef_getQRImage() : (ev.paymentQRImage||'')),
      certRequireFeedback: document.getElementById('ef_certfb').checked, color: ev.color||'#4CE0C6',
    };
    if(isEdit){
      Object.assign(ev, data); toast('Event updated.');
      DB.audit.push({id:uid('al'), user:getSession().name, action:'Updated event', entity:'Event', entityId:ev.id, timestamp:nowISO()});
    } else {
      const newEv = {id:uid('evt'), ...data};
      DB.events.push(newEv); toast('Event created.');
      DB.audit.push({id:uid('al'), user:getSession().name, action:'Created event', entity:'Event', entityId:newEv.id, timestamp:nowISO()});
    }
    save(); closeModal(); render();
  });
}

  ${tabBody()}`;
}
function filterRegsByTarget(regs, target){
  if(target==='all') return regs;
  if(target==='verified') return regs.filter(r=>r.status==='approved');
  if(target==='present') return regs.filter(r=>attForReg(r.id));
  if(target==='absent') return regs.filter(r=>r.status==='approved' && !attForReg(r.id));
  if(target==='unpaid') return regs.filter(r=>!r.paid);
  return regs;
}

function regStatusBadge(r){
  if(r.status==='pending') return `<span class="badge b-pending">Pending Approval</span>`;
  if(r.status==='rejected') return `<span class="badge b-rejected">Rejected</span>`;
  return `<span class="badge b-approved">Approved</span>`;
}
/* ---------------------------- Result / Award (Winner, Runner-ups, Participation) ---------------------------- */
const AWARD_OPTIONS = ['Participation','Winner','1st Runner Up','2nd Runner Up'];
function awardOf(r){ return r.award || 'Participation'; }
function awardBadgeClass(a){
  if(a==='Winner') return 'b-winner';
  if(a==='1st Runner Up') return 'b-runner1';
  if(a==='2nd Runner Up') return 'b-runner2';
  return 'b-draft';
}
function awardBadge(r){ const a = awardOf(r); return `<span class="badge ${awardBadgeClass(a)}">${esc(a)}</span>`; }
function awardSelectHTML(rid, current, extraAttr){
  return `<select class="mono" data-awardsel="${rid}" ${extraAttr||''}>${AWARD_OPTIONS.map(a=>`<option value="${esc(a)}" ${a===current?'selected':''}>${esc(a)}</option>`).join('')}</select>`;
}
function setRegAward(rid, award){
  const r = regById(rid); if(!r) return;
  if(!AWARD_OPTIONS.includes(award)) award = 'Participation';
  const changed = r.award !== award;
  r.award = award;
  if(changed){
    const ev = eventById(r.eventId);
    DB.audit.push({id:uid('al'), user:getSession().name, action:'Set result: '+award, entity:'Registration', entityId:rid, timestamp:nowISO()});
    const cert = certForReg(rid);
    if(cert){ cert.award = award; commSystem(r.userId, ev.id, `Your result for ${ev.name} was updated to "${award}". Your certificate now reflects this.`); }
    save(); toast('Result set to '+award+'.'); render();
  }
}

/* ---- Admin: Feedback form builder (per-event, admin-configurable questions) ---- */
function openFeedbackFormBuilder(ev){
  let qs = JSON.parse(JSON.stringify(getFeedbackForm(ev)));
  const typeLabels = {rating:'Star Rating', text:'Short Text', textarea:'Long Text', choice:'Multiple Choice', yesno:'Yes / No'};
  function rowHTML(q, i){
    return `
    <div class="card" style="padding:14px;margin-bottom:10px;">
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
        <div class="field" style="flex:1;min-width:160px;margin-bottom:0;"><label>Question Label</label><input data-qf="label" data-qi="${i}" value="${esc(q.label)}" placeholder="e.g. How was the venue?"></div>
        <div class="field" style="width:150px;margin-bottom:0;"><label>Type</label>
          <select data-qf="type" data-qi="${i}">${Object.keys(typeLabels).map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${typeLabels[t]}</option>`).join('')}</select>
        </div>
        <button type="button" class="btn btn-danger btn-sm" data-qdel="${i}" title="Remove question">✕</button>
      </div>
      ${q.type==='choice' ? `<div class="field" style="margin-top:10px;margin-bottom:0;"><label>Options (comma-separated)</label><input data-qf="options" data-qi="${i}" value="${esc((q.options||[]).join(', '))}" placeholder="e.g. Excellent, Good, Average, Poor"></div>` : ''}
      <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
        <input type="checkbox" data-qf="required" data-qi="${i}" style="width:auto;" ${q.required?'checked':''}>
        <label style="margin:0;">Required</label>
      </div>
    </div>`;
  }
  function renderList(){ return qs.map((q,i)=>rowHTML(q,i)).join('') || emptyState('📝','No questions yet','Add at least one question below.'); }
  openModal(`
    <div class="modal-head"><h3>Feedback Form — ${esc(ev.name)}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="hint" style="margin-bottom:14px;">Build the questions participants will answer after attending this event.</div>
    <div id="fqList">${renderList()}</div>
    <div style="display:flex;gap:10px;margin-top:6px;">
      <button type="button" class="btn btn-ghost btn-sm" id="fqAdd">+ Add Question</button>
      <button type="button" class="btn btn-ghost btn-sm" id="fqReset">Reset to Default</button>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:18px;" id="fqSave">Save Feedback Form</button>
  `);
  function bind(){
    document.getElementById('fqList').innerHTML = renderList();
    document.querySelectorAll('[data-qdel]').forEach(b=> b.addEventListener('click', ()=>{ qs.splice(parseInt(b.dataset.qdel,10),1); bind(); }));
    document.querySelectorAll('[data-qf]').forEach(el=> el.addEventListener('input', ()=>{
      const i = parseInt(el.dataset.qi,10); const f = el.dataset.qf;
      if(f==='required'){ qs[i].required = el.checked; }
      else if(f==='options'){ qs[i].options = el.value.split(',').map(s=>s.trim()).filter(Boolean); }
      else if(f==='type'){ qs[i].type = el.value; bind(); return; }
      else { qs[i][f] = el.value; }
    }));
  }
  bind();
  document.getElementById('fqAdd').addEventListener('click', ()=>{ qs.push({id:uid('q'), type:'rating', label:'', required:false}); bind(); });
  document.getElementById('fqReset').addEventListener('click', ()=>{
    if(!confirm('Reset to the default feedback form? This discards unsaved changes.')) return;
    qs = defaultFeedbackForm(); bind();
  });
  document.getElementById('fqSave').addEventListener('click', ()=>{
    const clean = qs.map(q=>({...q, label:(q.label||'').trim()})).filter(q=>q.label);
    if(!clean.length){ toast('Add at least one question with a label.','err'); return; }
    ev.feedbackForm = clean;
    DB.audit.push({id:uid('al'), user:getSession().name, action:'Updated feedback form', entity:'Event', entityId:ev.id, timestamp:nowISO()});
    save(); toast('Feedback form saved.'); closeModal(); render();
  });
}

/* Shared row-building for a given report kind + event, used by both CSV and PDF export */
function reportRows(kind, eventId){
  let header=[], rows=[];
  if(kind==='registrations'){
    header=['Participant ID','Team Name','Team Leader','Leader Email','Leader Mobile','College','Team Members','Registered On'];
    regsForEvent(eventId).forEach(r=>{ const u=userById(r.userId);
      const membersStr = (r.teamMembersList||[]).map(m=>`${m.name} <${m.email}>`).join('; ');
      rows.push([r.participantId, r.teamName||'', r.teamLeader||u.name, r.contactEmail||u.email, r.mobile||'', r.college||'', membersStr, fmtDate(r.createdAt)]);
    });
  } else if(kind==='attendance'){
    header=['Participant ID','Name','Time','Status'];
    regsForEvent(eventId).filter(r=>r.status==='approved').forEach(r=>{ const u=userById(r.userId); const a=attForReg(r.id); rows.push([r.participantId,u.name,a?a.timestamp:'',a?'Present':'Absent']); });
  } else if(kind==='feedback'){
    header=['Participant ID','Overall','Speaker','Organization','Venue','Comment'];
    DB.fb.filter(f=>f.eventId===eventId).forEach(f=>{ const r=regById(f.registrationId); rows.push([r.participantId,f.overall,f.speaker,f.organization,f.venue,(f.comment||'').replace(/\n/g,' ')]); });
  } else if(kind==='certificates'){
    header=['Certificate ID','Participant ID','Name','Role','Issued On'];
    DB.certs.filter(c=>c.eventId===eventId).forEach(c=>{ const r=regById(c.registrationId); const u=userById(r.userId); rows.push([c.certId,r.participantId,c.recipientName||u.name,c.role==='member'?'Team Member':'Team Leader',fmtDate(c.issuedAt)]); });
  }
  return {header, rows};
}

function exportCSV(kind, eventId){
  const ev = eventById(eventId); const {header, rows} = reportRows(kind, eventId);
  const name = `${ev.code}_${kind}.csv`;
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
  toast('CSV exported.');
}

/* Combined PDF export: registration + attendance + feedback + certificate reports, one PDF per event */
function exportFullReportPDF(eventId){
  const ev = eventById(eventId);
  if(!ev){ toast('Event not found.', 'err'); return; }
  if(!window.jspdf || !window.jspdf.jsPDF){ toast('PDF library failed to load.', 'err'); return; }
  const regs = regsForEvent(eventId);
  const present = DB.att.filter(a=>a.eventId===eventId).length;
  const verified = regs.filter(r=>r.status==='approved').length;
  const fbs = DB.fb.filter(f=>f.eventId===eventId);
  const certs = DB.certs.filter(c=>c.eventId===eventId);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const M = 40;

  function section(title, kvs, kind, isFirst){
    if(!isFirst) doc.addPage();
    let y = 50;
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(20);
    doc.text(ev.name, M, y); y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110);
    doc.text(`Generated ${new Date().toLocaleString()}`, M, y); y += 24;
    doc.setTextColor(0);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(title, M, y); y += 18;
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    kvs.forEach(([k,v])=>{ doc.text(`${k}: ${v}`, M, y); y += 14; });
    y += 10;
    const { header, rows } = reportRows(kind, eventId);
    if(rows.length){
      doc.autoTable({ startY:y, head:[header], body:rows, styles:{fontSize:7.5, cellPadding:4, overflow:'linebreak'}, headStyles:{fillColor:[76,224,198], textColor:20}, margin:{left:M, right:M} });
    } else {
      doc.setFont('helvetica','italic'); doc.setFontSize(10); doc.setTextColor(120);
      doc.text('No data available.', M, y);
    }
  }

  section('Registration Report', [['Total registrations',regs.length],['Present',present],['Absent',regs.length-present]], 'registrations', true);
  section('Attendance Report', [['Registered',regs.length],['Present',present],['Absent',verified-present],['Attendance %', verified? Math.round(present/verified*100)+'%':'0%']], 'attendance', false);
  section('Feedback Report', [['Responses',fbs.length],['Average rating', fbs.length?(fbs.reduce((s,f)=>s+f.overall,0)/fbs.length).toFixed(1):'—'],['Response rate', present? Math.round(fbs.length/present*100)+'%':'0%']], 'feedback', false);
  section('Certificate Report', [['Eligible', regs.filter(r=>attForReg(r.id) && (!ev.certRequireFeedback||fbForReg(r.id))).length],['Generated',certs.length]], 'certificates', false);

  doc.save(`${ev.code}_full_report.pdf`);
  toast('Full report PDF generated.');
}

let _qrStream = null, _qrRAF = null, _qrLastCode = '', _qrLastAt = 0, _qrTrack = null, _qrTorchOn = false, _qrFrameN = 0;
function stopQrScanner(){
  if(_qrRAF) cancelAnimationFrame(_qrRAF); _qrRAF = null;
  if(_qrStream){ _qrStream.getTracks().forEach(t=>t.stop()); _qrStream = null; }
  _qrTrack = null; _qrTorchOn = false; _qrFrameN = 0;
  const cam = document.getElementById('scanCam');
  if(cam) cam.classList.remove('active');
  const toggleBtn = document.getElementById('toggleCameraBtn');
  if(toggleBtn) toggleBtn.textContent = '📷 Start Camera Scan';
  const torchBtn = document.getElementById('torchBtn');
  if(torchBtn) torchBtn.style.display = 'none';
}
async function startQrScanner(){
  const cam = document.getElementById('scanCam');
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');
  const status = document.getElementById('scanStatus');
  const toggleBtn = document.getElementById('toggleCameraBtn');
  const torchBtn = document.getElementById('torchBtn');
  if(!cam || !video || !canvas) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Camera not supported on this device/browser.', 'err'); return;
  }
  const constraintAttempts = [
    { video: { facingMode: { ideal:'environment' }, width:{ideal:1920}, height:{ideal:1080}, focusMode:'continuous' } },
    { video: { facingMode: { ideal:'environment' }, width:{ideal:1280}, height:{ideal:720} } },
    { video: { facingMode: 'environment' } },
    { video: true },
  ];
  for(const c of constraintAttempts){
    try{ _qrStream = await navigator.mediaDevices.getUserMedia(c); break; }catch(err){ _qrStream = null; }
  }
  if(!_qrStream){
    toast('Could not access camera — check permissions.', 'err');
    return;
  }
  video.setAttribute('playsinline',''); video.muted = true;
  video.srcObject = _qrStream;
  await video.play();
  cam.classList.add('active');
  if(toggleBtn) toggleBtn.textContent = '✕ Stop Camera';
  if(status) status.textContent = 'Point camera at a QR code…';

  // Try continuous autofocus where supported, expose torch (flash) toggle for low light
  _qrTrack = _qrStream.getVideoTracks()[0];
  try{
    const caps = _qrTrack.getCapabilities ? _qrTrack.getCapabilities() : {};
    const adv = [];
    if(caps.focusMode && caps.focusMode.includes('continuous')) adv.push({focusMode:'continuous'});
    if(adv.length) await _qrTrack.applyConstraints({advanced: adv});
    if(torchBtn){ torchBtn.style.display = caps.torch ? 'inline-flex' : 'none'; }
  }catch(e){ /* not all browsers support this */ }

  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;

  const decode = (data, w, h)=> (window.jsQR ? jsQR(data, w, h, { inversionAttempts: 'attemptBoth' }) : null);

  const tick = ()=>{
    if(!_qrStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth){
      _qrFrameN++;
      const vw = video.videoWidth, vh = video.videoHeight;
      canvas.width = vw; canvas.height = vh;
      ctx.drawImage(video, 0, 0, vw, vh);
      let code = null;
      try{
        const full = ctx.getImageData(0, 0, vw, vh);
        code = decode(full.data, full.width, full.height);
        // If nothing found, try a magnified centre crop (matches the on-screen guide box)
        // — helps a lot with small / far-away or low-contrast codes. Alternate frames to save CPU.
        if(!code && _qrFrameN % 2 === 0){
          const cropW = Math.floor(vw*0.7), cropH = Math.floor(vh*0.7);
          const cropX = Math.floor((vw-cropW)/2), cropY = Math.floor((vh-cropH)/2);
          const crop = ctx.getImageData(cropX, cropY, cropW, cropH);
          const zoomCanvas = document.createElement('canvas');
          zoomCanvas.width = cropW*2; zoomCanvas.height = cropH*2;
          const zctx = zoomCanvas.getContext('2d');
          zctx.imageSmoothingEnabled = false;
          const cropCanvas = document.createElement('canvas');
          cropCanvas.width = cropW; cropCanvas.height = cropH;
          cropCanvas.getContext('2d').putImageData(crop, 0, 0);
          zctx.drawImage(cropCanvas, 0, 0, cropW*2, cropH*2);
          const zoomed = zctx.getImageData(0, 0, cropW*2, cropH*2);
          code = decode(zoomed.data, zoomed.width, zoomed.height);
        }
      }catch(e){ /* ignore decode errors */ }
      const now = Date.now();
      if(code && code.data && !(code.data===_qrLastCode && now-_qrLastAt < 2000)){
        _qrLastCode = code.data; _qrLastAt = now;
        handleQrDetected(code.data);
      }
    }
    _qrRAF = requestAnimationFrame(tick);
  };
  _qrRAF = requestAnimationFrame(tick);
}
function toggleTorch(){
  if(!_qrTrack) return;
  _qrTorchOn = !_qrTorchOn;
  _qrTrack.applyConstraints({advanced:[{torch:_qrTorchOn}]}).catch(()=>{ toast('Flash not supported on this device.','err'); _qrTorchOn=false; });
  const torchBtn = document.getElementById('torchBtn');
  if(torchBtn) torchBtn.textContent = _qrTorchOn ? '💡 Flash On' : '💡 Flash';
}
function extractParticipantId(text){
  if(!text) return '';
  const t = text.trim();
  // If the QR encodes a URL or JSON, try to pull out something that looks like a Participant ID (e.g. EVT2387-P00002)
  const m = t.match(/[A-Za-z0-9]+-P\d+/);
  return m ? m[0] : t;
}
function handleQrDetected(raw){
  const input = document.getElementById('teamIdInput');
  const sel = document.getElementById('scanEventSel');
  const status = document.getElementById('scanStatus');
  const id = extractParticipantId(raw);
  if(input) input.value = id;
  if(status) status.textContent = `Detected: ${id} — marking present…`;
  if('vibrate' in navigator){ try{ navigator.vibrate(80); }catch(e){} }
  markByTeamId(sel ? sel.value : '', id, 'present');
  setTimeout(()=>{ const s = document.getElementById('scanStatus'); if(s) s.textContent = 'Point camera at a QR code…'; }, 1600);
}

function markByTeamId(eventId, teamId, action){
  const box = document.getElementById('scanResult');
  if(!eventId){ box.innerHTML = `<div class="result-panel result-bad"><b style="color:var(--red);">No open event selected.</b></div>`; return; }
  if(!teamId){ box.innerHTML = `<div class="result-panel result-bad"><b style="color:var(--red);">Please enter a Team / Participant ID.</b></div>`; return; }
  const reg = DB.regs.find(r=> r.eventId===eventId && r.participantId.toLowerCase()===teamId.toLowerCase());
  if(!reg){ box.innerHTML = `<div class="result-panel result-bad"><b style="color:var(--red);">✕ No registration found with that ID for this event.</b></div>`; return; }
  const u = userById(reg.userId); const ev = eventById(eventId);
  const existing = attForReg(reg.id);
  if(action==='present'){
    if(existing){ box.innerHTML = resultBlock(u, reg, ev, existing, true); return; }
    const att = {id:uid('att'), eventId, registrationId:reg.id, participantId:reg.participantId, timestamp:fmtTime(nowISO()), date:ev.date, status:'present'};
    DB.att.push(att);
    commSystem(reg.userId, ev.id, `Your attendance for ${ev.name} has been recorded.`);
    DB.audit.push({id:uid('al'), user:getSession().name, action:'Marked attendance present', entity:'Registration', entityId:reg.id, timestamp:nowISO()});
    save(); toast('Marked present.');
    box.innerHTML = resultBlock(u, reg, ev, att, false);
  } else {
    if(!existing){
      box.innerHTML = `<div class="result-panel result-bad">
        <b style="color:var(--red);font-size:15px;">Already Absent</b>
        <div class="kv-row" style="margin-top:10px;"><span>Team</span><b>${esc(reg.teamName)||'—'}</b></div>
        <div class="kv-row"><span>Team Leader</span><b>${esc(reg.teamLeader)||esc(u.name)}</b></div>
        <div class="kv-row"><span>Participant ID</span><b class="mono">${reg.participantId}</b></div>
        <div class="kv-row"><span>Event</span><b>${esc(ev.name)}</b></div>
      </div>`;
      return;
    }
    DB.att = DB.att.filter(a=>a.id!==existing.id);
    DB.audit.push({id:uid('al'), user:getSession().name, action:'Marked attendance absent', entity:'Registration', entityId:reg.id, timestamp:nowISO()});
    save(); toast('Marked absent.');
    box.innerHTML = `<div class="result-panel result-bad">
      <b style="color:var(--red);font-size:15px;">✕ Marked Absent</b>
      <div class="kv-row" style="margin-top:10px;"><span>Team</span><b>${esc(reg.teamName)||'—'}</b></div>
      <div class="kv-row"><span>Team Leader</span><b>${esc(reg.teamLeader)||esc(u.name)}</b></div>
      <div class="kv-row"><span>Participant ID</span><b class="mono">${reg.participantId}</b></div>
      <div class="kv-row"><span>Event</span><b>${esc(ev.name)}</b></div>
    </div>`;
  }
}

function openRegistrationForm(eventId, session){

  if(count>=ev.capacity){ toast('Registration Closed — capacity reached.','err'); return; }

  const hasFee = (ev.fee||0) > 0;

  const minExtra = Math.max(teamMin-1,0), maxExtra = Math.max(teamMax-1,0);
  openModal(`

        <div id="rf_members_list" style="display:flex;flex-direction:column;gap:10px;"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="rf_add_member" style="margin-top:8px;">+ Add Team Member</button>
        <div class="hint" style="margin-top:6px;">Add each additional team member's name and email ID (besides the team leader above).</div>
      </div>
      ${hasFee? `
      <div class="field" style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px;">
        <label style="margin-bottom:10px;">Payment — ₹${ev.fee}</label>
        <div style="text-align:center;">
          ${ev.paymentQRImage? `
          <div class="qr-box" style="margin:0 auto;width:170px;height:170px;display:flex;align-items:center;justify-content:center;"><img src="${ev.paymentQRImage}" style="max-width:100%;max-height:100%;"></div>
          ${ev.paymentInfo? `<div class="mono tl-sub" style="margin-top:8px;">Pay to: ${esc(ev.paymentInfo)}</div>` : ''}
          ` : ev.paymentInfo? `
          <div class="qr-box" id="regPayQrTarget" style="margin:0 auto;width:170px;height:170px;"></div>
          <div class="mono tl-sub" style="margin-top:8px;">Pay to: ${esc(ev.paymentInfo)}</div>
          ` : `<div class="hint">Payment details for this event have not been set up yet. Please contact the organizer, then still enter your transaction ID below once paid.</div>`}
        </div>
        <div class="field" style="margin-top:12px;margin-bottom:0;">
          <label>Transaction ID / UTR Number</label>
          <input id="rf_txn" required placeholder="Enter the transaction ID / UTR after paying">
          <div class="hint">Pay the amount above first, then enter the transaction ID from your payment app. Your registration will be verified against this by the organizer.</div>
        </div>
      </div>` : ''}
      <button class="btn btn-primary" style="width:100%;margin-top:6px;" type="submit">${hasFee?'Submit Registration & Payment':'Submit Registration'}</button>
    </form>
  `);
  if(hasFee && !ev.paymentQRImage && ev.paymentInfo){
    new QRCode(document.getElementById('regPayQrTarget'), {text: 'upi://pay?pa='+encodeURIComponent(ev.paymentInfo)+'&am='+ev.fee+'&cu=INR&tn='+encodeURIComponent(ev.code||'Registration'), width:170, height:170, colorDark:'#0B0F14', colorLight:'#ffffff'});
  }
  let extraCount = minExtra;
  const listEl = document.getElementById('rf_members_list');
  const addBtn = document.getElementById('rf_add_member');
  function renderRows(){
    listEl.innerHTML = '';
    for(let i=0;i<extraCount;i++){
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:flex-end;';
      row.innerHTML = `
        <div class="field" style="flex:1;margin-bottom:0;"><label style="font-size:12px;">Member ${i+1} Name</label><input class="rf-mem-name" placeholder="Full name"></div>
        <div class="field" style="flex:1;margin-bottom:0;"><label style="font-size:12px;">Member ${i+1} Email</label><input type="email" class="rf-mem-email" placeholder="email@example.com"></div>
        ${extraCount>minExtra? `<button type="button" class="btn btn-ghost btn-sm rf-remove-member" data-idx="${i}" style="height:38px;">✕</button>` : ''}
      `;
      listEl.appendChild(row);
    }
    listEl.querySelectorAll('.rf-remove-member').forEach(b=> b.addEventListener('click', ()=>{ extraCount = Math.max(extraCount-1, minExtra); renderRows(); }));
    addBtn.style.display = extraCount>=maxExtra? 'none':'';
  }
  renderRows();
  addBtn.addEventListener('click', ()=>{ if(extraCount<maxExtra){ extraCount++; renderRows(); } });

  document.getElementById('regForm').addEventListener('submit', e=>{
    e.preventDefault();
    const teamName = document.getElementById('rf_team').value.trim();
    const leader = document.getElementById('rf_leader').value.trim();
    const email = document.getElementById('rf_email').value.trim();
    const mobile = document.getElementById('rf_mobile').value.trim();
    const college = document.getElementById('rf_college').value.trim();
    const txn = hasFee? document.getElementById('rf_txn').value.trim() : '';
    const members = [...document.querySelectorAll('.rf-mem-name')].map((el,i)=>({
      name: el.value.trim(),
      email: document.querySelectorAll('.rf-mem-email')[i].value.trim()
    }));
    if(!teamName || !leader || !email || !mobile || !college || (hasFee && !txn)){
      toast('Please fill in all required fields.','err'); return;
    }
    if(!/^[0-9]{10}$/.test(mobile)){ toast('Enter a valid 10-digit mobile number.','err'); return; }
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if(!emailRe.test(email)){ toast('Enter a valid team leader email.','err'); return; }
    if(members.some(m=>!m.name || !m.email)){ toast('Please fill in the name and email for every team member.','err'); return; }
    if(members.some(m=>!emailRe.test(m.email))){ toast('Please enter valid email addresses for all team members.','err'); return; }
    const totalSize = 1 + members.length;
    if(totalSize < teamMin || totalSize > teamMax){
      toast(`Team size must be between ${teamMin} and ${teamMax} (including leader). Currently ${totalSize}.`,'err'); return;
    }
    completeRegistration(ev, session, {teamName, teamLeader:leader, members, email, mobile, college, transactionId: txn});
  });
}
function completeRegistration(ev, session, details){
  DB.counter = (DB.counter||1);

  const pid = ev.code+'-P'+pad(n);

  const r = {id:uid('reg'), eventId:ev.id, userId:session.id, participantId:pid, regId:rid, status:'pending',

function approveReg(rid, award){
  const r = regById(rid); if(!r) return;
  if(!award){ const sel = document.querySelector(`[data-awardsel="${rid}"]`); award = sel ? sel.value : awardOf(r); }
  if(!AWARD_OPTIONS.includes(award)) award = 'Participation';
  r.status = 'approved'; r.reviewedAt = nowISO(); r.reviewedBy = getSession().name; r.award = award;
  const ev = eventById(r.eventId);
  commSystem(r.userId, ev.id, `Your registration for ${ev.name} has been approved as "${award}". Participant ID ${r.participantId}. Your QR code is now available.`);
  DB.audit.push({id:uid('al'), user:getSession().name, action:'Approved registration ('+award+')', entity:'Registration', entityId:rid, timestamp:nowISO()});
  save(); toast('Registration approved as '+award+'.'); render();

function nextCertId(){ return 'CERT-2026-'+pad(DB.certs.length+1); }
function generateCertificate(rid){
  const r = regById(rid); const ev = eventById(r.eventId); const u = userById(r.userId);
  if(certForReg(rid)){ toast('Certificate already generated.','err'); return; }
  const cert = {id:uid('cert'), eventId:ev.id, registrationId:rid, certId:nextCertId(), issuedAt:nowISO(), award:awardOf(r), recipientName:u.name};
  DB.certs.push(cert);
  const memberNames = certRosterNames(ev, r);
  memberNames.forEach(name=>{
    DB.certs.push({id:uid('cert'), eventId:ev.id, registrationId:rid, certId:nextCertId(), issuedAt:nowISO(), award:awardOf(r), recipientName:name, role:'member'});
  });
  commSystem(u.id, ev.id, `Your certificate for ${ev.name} is ready to download.`+(memberNames.length?` Certificates for your ${memberNames.length} team member(s) are also ready in your Certificates tab.`:''));
  DB.audit.push({id:uid('al'), user:getSession().name, action:'Certificate generated', entity:'Registration', entityId:rid, timestamp:nowISO()});
  if(memberNames.length) DB.audit.push({id:uid('al'), user:getSession().name, action:'Team member certificates generated ('+memberNames.length+')', entity:'Registration', entityId:rid, timestamp:nowISO()});
  save(); toast(memberNames.length? `Certificate generated for the team leader + ${memberNames.length} member(s).` : 'Certificate generated.'); render();
}

function drawCertificate(cert, cb){
  const r = regById(cert.registrationId); const ev = eventById(cert.eventId); const u = userById(r.userId);
  const award = cert.award || awardOf(r);
  const hasAward = award && award !== 'Participation';
  const off = hasAward ? 30 : 0;
  const AWARD_COLORS = {'Winner':'#F5B85B','1st Runner Up':'#A78BFA','2nd Runner Up':'#4CE0C6'};
  const AWARD_ICONS = {'Winner':'\u{1F3C6}','1st Runner Up':'\u{1F948}','2nd Runner Up':'\u{1F949}'};
  const canvas = document.createElement('canvas'); canvas.width=1200; canvas.height=850;
  const ctx = canvas.getContext('2d');
  // background
  ctx.fillStyle = '#0B0F14'; ctx.fillRect(0,0,1200,850);
  const grad = ctx.createLinearGradient(0,0,1200,850);
  grad.addColorStop(0,'#0d141c'); grad.addColorStop(1,'#141020');
  ctx.fillStyle = grad; ctx.fillRect(0,0,1200,850);
  // border
  ctx.strokeStyle = '#4CE0C6'; ctx.lineWidth=3; ctx.strokeRect(40,40,1120,770);
  ctx.strokeStyle = 'rgba(167,139,250,.5)'; ctx.lineWidth=1; ctx.strokeRect(56,56,1088,738);
  // header
  ctx.textAlign='center';
  ctx.fillStyle='#4CE0C6'; ctx.font='700 20px Space Grotesk, sans-serif';
  ctx.fillText('C O R E X', 600, 130);
  ctx.fillStyle='#8FA0B3'; ctx.font='500 14px Inter, sans-serif';
  ctx.fillText('EVENT MANAGEMENT AUTOMATION PORTAL', 600, 155);

  ctx.fillStyle='#E7EDF4'; ctx.font='700 40px Space Grotesk, sans-serif';
  ctx.fillText(hasAward ? 'CERTIFICATE OF ACHIEVEMENT' : 'CERTIFICATE OF PARTICIPATION', 600, 235);
  if(hasAward){
    ctx.fillStyle = AWARD_COLORS[award] || '#F5B85B';
    ctx.font = '700 21px Space Grotesk, sans-serif';
    ctx.fillText((AWARD_ICONS[award]||'\u2605')+'  '+award.toUpperCase(), 600, 267);
  }
  ctx.fillStyle='#8FA0B3'; ctx.font='400 17px Inter, sans-serif';
  ctx.fillText('This certificate is proudly presented to', 600, 285+off);

  const recipientName = cert.recipientName || u.name;
  ctx.fillStyle='#A78BFA'; ctx.font='700 46px Space Grotesk, sans-serif';
  ctx.fillText(recipientName, 600, 355+off);

  if(r.teamName){
    ctx.fillStyle='#5B6C80'; ctx.font='600 13px Inter, sans-serif';
    ctx.fillText((cert.role==='member'?'TEAM MEMBER':'TEAM LEADER')+' · '+r.teamName.toUpperCase(), 600, 378+off);
  }

  ctx.fillStyle='#8FA0B3'; ctx.font='400 17px Inter, sans-serif';
  ctx.fillText('for successfully participating in', 600, 400+off);
  ctx.fillStyle='#E7EDF4'; ctx.font='700 28px Space Grotesk, sans-serif';
  wrapText(ctx, ev.name, 600, 440+off, 820, 34);

  ctx.fillStyle='#8FA0B3'; ctx.font='400 16px Inter, sans-serif';
  ctx.fillText('held on '+fmtDate(ev.date)+' at '+ev.venue, 600, 495+off);

  ctx.textAlign='left';
  ctx.fillStyle='#5B6C80'; ctx.font='500 13px Inter, sans-serif';
  ctx.fillText('ORGANIZER', 130, 690);
  ctx.strokeStyle='#233042'; ctx.beginPath(); ctx.moveTo(130,660); ctx.lineTo(340,660); ctx.stroke();
  ctx.fillStyle='#E7EDF4'; ctx.font='600 16px Inter, sans-serif';
  ctx.fillText(ev.organizer||'Event Organizer', 130, 645);

  ctx.textAlign='left';
  ctx.fillStyle='#5B6C80'; ctx.font='500 13px Inter, sans-serif';
  ctx.fillText('CERTIFICATE ID', 500, 700);
  ctx.fillStyle='#4CE0C6'; ctx.font='600 16px JetBrains Mono, monospace';
  ctx.fillText(cert.certId, 500, 720);

  // QR
  const tmp = document.createElement('div');
  document.body.appendChild(tmp);
  new QRCode(tmp, {text:'VERIFY:'+cert.certId, width:120, height:120, colorDark:'#0B0F14', colorLight:'#ffffff'});
  setTimeout(()=>{
    const qrCanvas = tmp.querySelector('canvas');
    if(qrCanvas) ctx.drawImage(qrCanvas, 970, 620, 120, 120);
    ctx.fillStyle='#5B6C80'; ctx.font='400 11px Inter, sans-serif'; ctx.textAlign='center';
    ctx.fillText('Scan to verify', 1030, 755);
    document.body.removeChild(tmp);
    cb(canvas);
  }, 60);
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' '); let line=''; let lines=[];
  for(let w of words){ const test = line+w+' '; if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w+' '; } else line=test; }
  lines.push(line);
  const startY = y - (lines.length-1)*lineHeight/2;
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, startY+i*lineHeight));
}

}

/* =========================================================================
   COMMUNICATION CENTER
   One service (commSend) creates every message in the portal — manual
   broadcasts, templates with attachments, replies and automatic system
   messages. One shared panel (commPanel) shows them. Admin, Event
   Coordinator and Participant pages simply mount that panel with a
   different role; what each role can see and send is decided by the
   permission checks in commAuthorize() / commCanAccessEvent().
   ========================================================================= */
const COMM_MAX_FILE = 1.5*1024*1024;
const COMM_MAX_FILES = 5;
const COMM_ACCEPT = '.ppt,.pptx,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.png,.jpg,.jpeg,.zip';
const COMM_PLACEHOLDERS = [
  ['name','Recipient name'], ['team_name','Team name'], ['participant_id','Participant ID'],
  ['event_name','Event name'], ['event_date','Event date'], ['start_time','Start time'], ['end_time','End time'],
  ['venue','Venue / link'], ['mode','Mode'], ['speaker','Speaker'], ['organizer','Organizer'], ['fee','Fee']
];
const COMM_BUILTIN = [
  {id:'b_reg', name:'Registration Confirmation', subject:'Registration confirmed', body:'Hello {{name}}, your registration for {{event_name}} is confirmed. Date: {{event_date}}, Venue: {{venue}}. Participant ID: {{participant_id}}.'},

  {id:'b_venue', name:'Venue Update', subject:'Venue update: {{event_name}}', body:'Update: the venue for {{event_name}} is now {{venue}}.'},
  {id:'b_announce', name:'Event Announcement', subject:'Announcement: {{event_name}}', body:'Announcement regarding {{event_name}}: please check your dashboard for the latest details.'},
  {id:'b_att', name:'Attendance Confirmation', subject:'Attendance recorded', body:'Hi {{name}}, your attendance for {{event_name}} has been recorded.'},
  {id:'b_fb', name:'Feedback Request', subject:'Share your feedback', body:'Hi {{name}}, please share your feedback for {{event_name}} — it only takes a minute.'},
