  {id:'b_ppt', name:'Share PPT Template', subject:'Presentation template for {{event_name}}', body:'Hello {{name}},\n\nThe presentation template for {{event_name}} is attached. Please use it for your team ({{team_name}}) and reply here if you have any questions.'},
];

/* ---------------------------- permissions ---------------------------- */
function commViewer(){ const s = getSession(); return s ? (userById(s.id) || s) : null; }
function commRoleLabel(role){ return role==='staff' ? 'Coordinator' : role==='admin' ? 'Admin' : role==='participant' ? 'Participant' : 'System'; }

/* Admin and Coordinator: every event. Participant: events they registered for. */
function commCanAccessEvent(user, ev){
  if(!user || !ev) return false;
  if(user.role==='admin') return true;
  if(user.role==='staff') return true;
  if(user.role==='participant') return DB.regs.some(r=>r.eventId===ev.id && r.userId===user.id);
  return false;
}
function commEventsFor(user){ return DB.events.filter(e=>commCanAccessEvent(user, e)); }
function commOrganizersOf(ev){
  return DB.users.filter(u=> u.role==='admin' || (u.role==='staff' && commCanAccessEvent(u, ev)));
}
function commAuthorize(sender, ev, ids){
  const recips = ids.map(userById);
  if(recips.some(u=>!u)) return {ok:false, error:'One of the recipients no longer exists.'};
  if(sender.role==='admin') return {ok:true};
  if(sender.role==='staff'){
    const okAll = recips.every(u=> u.role==='admin' ||
      (u.role==='participant' && ev && commCanAccessEvent(sender, ev) && DB.regs.some(r=>r.eventId===ev.id && r.userId===u.id)));
    return okAll ? {ok:true} : {ok:false, error:'Coordinators can only message participants of the selected event, or the admin.'};
  }
  if(sender.role==='participant'){
    const registered = ev && DB.regs.some(r=>r.eventId===ev.id && r.userId===sender.id);
    const okAll = registered && recips.every(u=> commOrganizersOf(ev).some(o=>o.id===u.id));
    return okAll ? {ok:true} : {ok:false, error:'You can only message the organizers of events you are registered for.'};
  }
  return {ok:false, error:'You are not allowed to send messages.'};
}

/* ---------------------------- the service ---------------------------- */
function commFill(text, ev, reg, user){
  const map = {
    name: user ? user.name : '', team_name: reg ? (reg.teamName||'') : '', participant_id: reg ? reg.participantId : '',
    event_name: ev ? ev.name : '', event_date: ev ? fmtDate(ev.date) : '',
    start_time: ev ? (ev.startTime||'TBA') : '', end_time: ev ? (ev.endTime||'TBA') : '',
    venue: ev ? (ev.venue||'TBA') : '', mode: ev ? (ev.mode||'Offline') : '', speaker: ev ? (ev.speaker||'TBA') : '',
    organizer: ev ? (ev.organizer||'') : '', fee: ev ? ((ev.fee||0)>0 ? '₹'+ev.fee : 'Free') : ''
  };
  return String(text||'').replace(/\{\{\s*(\w+)\s*\}\}/g, (m,k)=> (k in map) ? map[k] : m);
}
function commThreadKeyFor(sender, recipient, eventId){
  const sr = sender ? sender.role : 'system', rr = recipient.role, ek = eventId || 'general';
  if(sr==='participant') return 'p:'+ek+':'+sender.id;
  if(rr==='participant') return 'p:'+ek+':'+recipient.id;
  if(sr==='staff' && rr==='admin') return 's:'+sender.id;
  if(sr==='admin' && rr==='staff') return 's:'+recipient.id;
  return null;
}
function commStoreFiles(list){
  return (list||[]).map(f=>{
    if(f.fileId) return {fileId:f.fileId, name:f.name, type:f.type, size:f.size};
    const id = uid('file');
    DB.files[id] = {name:f.name, type:f.type, size:f.size, data:f.data};
    return {fileId:id, name:f.name, type:f.type, size:f.size};
  });
}
/* commSend — the only function that creates messages.
   o: {sender (user | null = system), eventId, recipientIds[], subject, body, personalize, files[],
       channels[], kind, direct, threadKey} */
function commSend(o){
  const sender = o.sender || null;
  const ev = o.eventId ? eventById(o.eventId) : null;
  const ids = [...new Set(o.recipientIds || [])];
  if(!ids.length) return {ok:false, error:'No recipients selected.'};
  if(sender){ const chk = commAuthorize(sender, ev, ids); if(!chk.ok) return chk; }
  const files = commStoreFiles(o.files);
  const batchId = uid('mb'), ts = nowISO();
  let count = 0;
  ids.forEach(rid=>{
    const u = userById(rid); if(!u) return;
    const reg = ev ? DB.regs.find(r=>r.eventId===ev.id && r.userId===rid) : null;
    DB.messages.push({
      id:uid('msg'), batchId, eventId: ev ? ev.id : '', senderId: sender ? sender.id : null, senderRole: sender ? sender.role : 'system',
      recipientId:rid, kind:o.kind||'text', direct:!!o.direct,
      subject: o.personalize ? commFill(o.subject||'', ev, reg, u) : (o.subject||''),
      body: o.personalize ? commFill(o.body||'', ev, reg, u) : (o.body||''),
      files, channels:o.channels||['in_app'], status:'delivered', readAt:null, createdAt:ts,
      threadKey: o.threadKey || commThreadKeyFor(sender, u, ev ? ev.id : '')
    });
    count++;
  });
  save();
  return {ok:true, batchId, count};
}
/* automatic messages (registration, payment, attendance, certificate) go through the same service */
function commSystem(userId, eventId, body){
  return commSend({sender:null, eventId, recipientIds:[userId], body, kind:'system', channels:['in_app']});
}
function commUnread(v, eventId){
  return DB.messages.filter(m=> m.recipientId===v.id && m.status!=='read' && (!eventId || m.eventId===eventId)).length;
}
function commBadgeHTML(tab, session){
  if(tab==='registrations' && session.role==='admin'){
    const n = DB.regs.filter(r=>r.status==='pending').length;
    return n ? `<span class="side-count">${n}</span>` : '';
  }
  if(tab!=='messages' && tab!=='communication') return '';
  const n = commUnread(session);
  return n ? `<span class="side-count">${n}</span>` : '';
}
function commRefreshBadge(){
  const v = commViewer(); if(!v) return;
  const n = commUnread(v);
  document.querySelectorAll('.side-link[data-go$="/messages"], .side-link[data-go$="/communication"]').forEach(el=>{
    let b = el.querySelector('.side-count');
    if(n){ if(!b){ b = document.createElement('span'); b.className = 'side-count'; el.appendChild(b); } b.textContent = n; }
    else if(b) b.remove();
  });
}

/* ---------------------------- files ---------------------------- */
function commFileIcon(name){
  const e = (String(name).split('.').pop()||'').toLowerCase();
  if(e==='ppt'||e==='pptx') return '📊'; if(e==='pdf') return '📕';
  if(e==='doc'||e==='docx'||e==='txt') return '📄'; if(e==='xls'||e==='xlsx'||e==='csv') return '📗';
  if(e==='png'||e==='jpg'||e==='jpeg') return '🖼️'; return '📎';
}
function commSize(n){ return n > 1048576 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB'; }
/* mode: 'download' (stored file), 'remove' (pending file with × button), 'static' */
function commFileChips(files, mode){
  return (files||[]).map((f,i)=>{
    const inner = `${commFileIcon(f.name)} ${esc(f.name)} <span class="tl-sub">${commSize(f.size)}</span>`;
    if(mode==='download') return `<button type="button" class="file-chip file-dl" data-dlfile="${esc(f.fileId)}" title="Download">${inner}<span>↓</span></button>`;
    if(mode==='remove') return `<span class="file-chip">${inner}<button type="button" class="file-x" data-rmfile="${i}" title="Remove">×</button></span>`;
    return `<span class="file-chip">${inner}</span>`;
  }).join('');
}
function commReadFiles(fileList){
  return Promise.all([...fileList].map(f=> new Promise(res=>{
    if(f.size > COMM_MAX_FILE){ toast(f.name+' is larger than 1.5 MB.', 'err'); return res(null); }
    const r = new FileReader();
    r.onload = ()=> res({name:f.name, type:f.type||'application/octet-stream', size:f.size, data:r.result});
    r.onerror = ()=> res(null);
    r.readAsDataURL(f);
  }))).then(list=>list.filter(Boolean));
}
function commAddFiles(list, added){
  added.forEach(f=>{
    if(list.length >= COMM_MAX_FILES){ toast('Up to '+COMM_MAX_FILES+' attachments per message.', 'err'); return; }
    list.push(f);
  });
}
function commDownload(fileId){
  const f = DB.files[fileId];
  if(!f){ toast('This file is no longer available.', 'err'); return; }
  const parts = f.data.split(','), mime = (parts[0].match(/:(.*?);/)||[])[1] || 'application/octet-stream';
  const bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], {type:mime}));
  const a = document.createElement('a'); a.href = url; a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
document.addEventListener('click', e=>{
  const dl = e.target.closest('[data-dlfile]'); if(dl){ commDownload(dl.dataset.dlfile); return; }
  const dv = e.target.closest('[data-deliver]'); if(dv){ commOpenDelivery(dv.dataset.deliver); }
});

/* ---------------------------- panel state ---------------------------- */
let COMM_CTX = null;
const CU = {};
function commResetUI(key, ctx){
  Object.keys(CU).forEach(k=>delete CU[k]);
  Object.assign(CU, {key, tab:'compose', eventId:ctx.eventId||'', target:'all', oneUser:'', tpl:'', subject:'', body:'', files:[],
    ext:{email:false, whatsapp:false}, f:{q:'', event:'', status:'', src:''}, thread:'', reply:'', replyFiles:[]});
}
/* Mount point used by every role. ctx: {role, viewerId, eventId?} — eventId locks the panel to one event. */
function commPanel(ctx){
  const key = ctx.role+'|'+(ctx.eventId||'*')+'|'+ctx.viewerId;
  if(CU.key !== key) commResetUI(key, ctx);

function commPaint(){
  const root = document.getElementById('commRoot'); if(!root) return;
  const v = commViewer(); if(!v) return;
  if(v.role==='participant'){ commPaintInbox(root, v); commRefreshBadge(); return; }

  root.innerHTML = `<div class="comm-seg">${tabs.map(t=>`<div class="seg ${CU.tab===t[0]?'active':''}" data-ctab="${t[0]}">${t[1]}</div>`).join('')}</div><div id="commTabBody"></div>`;
  root.querySelectorAll('[data-ctab]').forEach(t=>t.addEventListener('click', ()=>{ commSyncCompose(); CU.tab = t.dataset.ctab; commPaint(); }));
  const body = root.querySelector('#commTabBody');
  if(CU.tab==='compose') commPaintCompose(body, v);
  else if(CU.tab==='inbox') commPaintInbox(body, v);
  else if(CU.tab==='templates') commPaintTemplates(body, v);
  else commPaintLog(body, v);
  commRefreshBadge();
}

/* ---------------------------- compose ---------------------------- */
function commTemplatesFor(v, eventId){
  const custom = DB.templates.filter(t=>{
    if(t.eventId){ const ev = eventById(t.eventId); if(!ev) return false; if(v.role==='staff' && !commCanAccessEvent(v, ev)) return false; }
    if(eventId) return !t.eventId || t.eventId===eventId;
    return true;
  });
  return {builtin:COMM_BUILTIN, custom};
}
function commScope(v){
  const events = commEventsFor(v);
  let eventId = COMM_CTX.eventId || CU.eventId || '';
  if(v.role==='staff' && !eventId && events.length) eventId = events[0].id;
  if(eventId && !events.some(e=>e.id===eventId)) eventId = '';
  CU.eventId = eventId;
  const ev = eventId ? eventById(eventId) : null;
  let targets;
  if(ev){
    targets = [['all','All participants'], ['verified','Verified participants'], ['present','Present participants'],
      ['absent','Absent participants'], ['unpaid','Payment pending'], ['one','One participant…']];
    if(v.role==='staff') targets.push(['admins','Admin']);
  } else if(v.role==='admin'){
    targets = [['all','All participants (every event)'], ['coordinators','All coordinators']];
  } else {
    targets = [['admins','Admin']];
  }
  if(!targets.some(t=>t[0]===CU.target)) CU.target = targets[0][0];
  return {events, ev, eventId, targets};
}
function commResolve(v, sc){
  const t = CU.target;
  if(t==='admins') return DB.users.filter(u=>u.role==='admin').map(u=>u.id);
  if(t==='coordinators') return DB.users.filter(u=>u.role==='staff').map(u=>u.id);
  if(!sc.ev) return [...new Set(DB.regs.map(r=>r.userId))];
  const regs = regsForEvent(sc.ev.id);
  if(t==='one') return regs.some(r=>r.userId===CU.oneUser) ? [CU.oneUser] : [];
  return [...new Set(filterRegsByTarget(regs, t).map(r=>r.userId))];
}

function commSubmitCompose(v){
  commSyncCompose();
  const sc = commScope(v);
  const subject = CU.subject.trim(), text = CU.body.trim();
  if(!text && !CU.files.length){ toast('Write a message or attach a file.', 'err'); return; }
  const used = [...(subject+' '+text).matchAll(/\{\{\s*(\w+)\s*\}\}/g)].map(m=>m[1]);
  const known = COMM_PLACEHOLDERS.map(p=>p[0]);
  const unknown = used.find(k=>!known.includes(k));
  if(unknown){ toast('Unknown placeholder {{'+unknown+'}}. Use the buttons under the message box.', 'err'); return; }
  const needsEvent = used.find(k=>k!=='name');
  if(!sc.ev && needsEvent){ toast('Choose a specific event to use {{'+needsEvent+'}}.', 'err'); return; }
  const ids = commResolve(v, sc);
  if(!ids.length){ toast(CU.target==='one' ? 'Choose a participant first.' : 'No recipients match this selection.', 'err'); return; }
  const channels = ['in_app'].concat(CU.ext.email ? ['email'] : [], CU.ext.whatsapp ? ['whatsapp'] : []);
  const tpl = COMM_BUILTIN.find(x=>x.id===CU.tpl) || DB.templates.find(x=>x.id===CU.tpl);
  const res = commSend({sender:v, eventId:sc.eventId, recipientIds:ids, subject, body:text, personalize:true, files:CU.files, channels,
    kind: tpl ? 'template' : 'text', direct: ['one','admins','coordinators'].includes(CU.target)});
  if(!res.ok){ toast(res.error, 'err'); return; }
  DB.audit.push({id:uid('al'), user:v.name, action:`Sent "${tpl ? tpl.name : (subject || 'message')}" to ${res.count} recipient(s)`, entity:'Event', entityId:sc.eventId, timestamp:nowISO()});
  save();
  toast('Sent to '+res.count+' recipient'+(res.count===1?'':'s')+'.');
  CU.tpl = ''; CU.subject = ''; CU.body = ''; CU.files = [];
  commPaint();
  if(channels.length > 1) commOpenDelivery(res.batchId);
}

/* email / WhatsApp hand-off: one ready-made link per recipient */
function commOpenDelivery(batchId){
  const msgs = DB.messages.filter(m=>m.batchId===batchId); if(!msgs.length) return;
  const ch = msgs[0].channels || [], wantWa = ch.includes('whatsapp'), wantMail = ch.includes('email');
  if(!wantWa && !wantMail) return;
  const rows = msgs.map(m=>{
    const u = userById(m.recipientId); if(!u) return '';
    const regs = DB.regs.filter(r=>r.userId===u.id);
    const reg = (m.eventId && regs.find(r=>r.eventId===m.eventId)) || regs[regs.length-1] || null;
    const mobile = reg && /^[0-9]{10}$/.test(reg.mobile||'') ? reg.mobile : '';
    const email = (reg && reg.contactEmail) || u.email;
    const text = (m.subject ? m.subject+'\n\n' : '') + (m.body||'') +
      (m.files && m.files.length ? '\n\nAttachments: '+m.files.map(f=>f.name).join(', ')+' — download them from Messages in your CoreX account.' : '');
    const wa = wantWa ? (mobile ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://wa.me/91${mobile}?text=${encodeURIComponent(text)}">WhatsApp</a>` : `<span class="tl-sub">No mobile no.</span>`) : '';
    const ml = wantMail ? (email ? `<a class="btn btn-ghost btn-sm" href="mailto:${esc(email)}?subject=${encodeURIComponent(m.subject||'Message from CoreX')}&body=${encodeURIComponent(text)}">Email</a>` : `<span class="tl-sub">No email</span>`) : '';
    return `<div class="kv-row" style="align-items:center;gap:10px;"><span style="flex:1;">${esc(u.name)}${reg?`<div class="tl-sub mono">${esc(reg.participantId)}</div>`:''}</span><span style="display:flex;gap:6px;">${wa}${ml}</span></div>`;
  }).join('');
  openModal(`
    <div class="modal-head"><h3>Send via ${[wantWa?'WhatsApp':'', wantMail?'Email':''].filter(Boolean).join(' / ')}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <p class="hint" style="margin:0 0 12px;">Each button opens WhatsApp or your mail app with the message ready to send. Attachments can't travel through these links — recipients download them from their Messages page.</p>
    ${rows}`);
}

/* ---------------------------- message log ---------------------------- */
function commLogRows(v){
  let rows = [...DB.messages].reverse().filter(m=>m.senderRole!=='participant');
  if(v.role==='staff') rows = rows.filter(m=> m.senderId===v.id || (m.eventId && commCanAccessEvent(v, eventById(m.eventId))));
  const evf = COMM_CTX.eventId || CU.f.event;
  if(evf) rows = rows.filter(m=>m.eventId===evf);
  if(CU.f.status) rows = rows.filter(m=>m.status===CU.f.status);
  if(CU.f.src==='auto') rows = rows.filter(m=>m.senderRole==='system');
  if(CU.f.src==='manual') rows = rows.filter(m=>m.senderRole!=='system');
  const q = CU.f.q.trim().toLowerCase();
  if(q) rows = rows.filter(m=>{
    const to = userById(m.recipientId), fr = userById(m.senderId);
    return [to&&to.name, to&&to.email, fr&&fr.name, m.subject, m.body].join(' ').toLowerCase().includes(q);
  });
  return rows.sort((a,b)=> a.createdAt<b.createdAt ? 1 : a.createdAt>b.createdAt ? -1 : 0);
}

        <td>${m.senderRole==='system' ? 'System' : esc(fr?fr.name:'—')}<div class="tl-sub">${m.senderRole==='system' ? 'Automatic' : commRoleLabel(m.senderRole)}</div></td>
        ${locked ? '' : `<td>${esc(ev?ev.name:'—')}</td>`}
        <td style="min-width:260px;">${m.subject?`<b>${esc(m.subject)}</b><br>`:''}${esc(m.body)}${m.files&&m.files.length?`<div class="file-row">${commFileChips(m.files,'download')}</div>`:''}</td>
        <td>${(m.channels||['in_app']).map(c=>`<span class="chan">${COMM_CH_LABEL[c]||c}</span>`).join('')}${ext?`<br><button class="btn btn-ghost btn-sm" data-deliver="${m.batchId}">Send links</button>`:''}</td>
        <td><span class="badge ${badgeClass(m.status)}">${m.status}</span></td>
        <td style="white-space:nowrap;">${fmtDate(m.createdAt)}<div class="tl-sub">${fmtTime(m.createdAt)}</div></td></tr>`;
    }).join('') || `<tr><td colspan="${locked?6:7}">${emptyState('✉️','No messages found','Messages you send, and automatic confirmations, appear here.')}</td></tr>`}</tbody></table>`;
}

/* ---------------------------- inbox (shared by every role) ---------------------------- */
function commDedupe(msgs, viewerId){
  const map = new Map();
  msgs.forEach(m=>{
    const k = m.batchId || m.id, cur = map.get(k);
    if(!cur || (m.recipientId===viewerId && cur.recipientId!==viewerId)) map.set(k, m);
  });
  return [...map.values()].sort((a,b)=> a.createdAt<b.createdAt ? -1 : a.createdAt>b.createdAt ? 1 : 0);
}
function commBatchRead(m){ return DB.messages.some(x=>x.batchId===m.batchId && x.status==='read'); }
function commSnippet(m){
  const t = ((m.subject ? m.subject+' — ' : '') + (m.body || (m.files&&m.files.length ? '📎 '+m.files[0].name : ''))).replace(/\s+/g,' ');
  return t.length > 70 ? t.slice(0,70)+'…' : t;
}
function commMakeThread(v, key, all, meta){
  const msgs = commDedupe(all, v.id);
  return Object.assign({key, threadKey:key, all, msgs, last:msgs[msgs.length-1]||null,
    unread: all.filter(m=>m.recipientId===v.id && m.status!=='read').length}, meta);
}
function commByLast(x, y){ const a = x.last?x.last.createdAt:'', b = y.last?y.last.createdAt:''; return a<b ? 1 : a>b ? -1 : 0; }
function commParticipantThreads(v){
  const out = [], seen = new Set();
  myRegs(v).forEach(r=>{
    const ev = eventById(r.eventId); if(!ev || seen.has(ev.id)) return; seen.add(ev.id);
    const tk = 'p:'+ev.id+':'+v.id;
    out.push(commMakeThread(v, ev.id, DB.messages.filter(m=>m.threadKey===tk),
      {title:ev.name, sub:fmtDate(ev.date)+(r.teamName?' · '+r.teamName:''), eventId:ev.id, kind:'event', canReply:true, threadKey:tk}));
  });
  const gk = 'p:general:'+v.id, gen = DB.messages.filter(m=>m.threadKey===gk);
  if(gen.length) out.push(commMakeThread(v, 'general', gen, {title:'General announcements', sub:'From the organizers', eventId:'', kind:'general', canReply:false, threadKey:gk}));
  return out.sort(commByLast);
}
function commOrganizerThreads(v){
  const groups = {};
  DB.messages.forEach(m=>{ if(m.threadKey) (groups[m.threadKey] = groups[m.threadKey] || []).push(m); });
  const out = [];
  Object.keys(groups).forEach(key=>{
    const all = groups[key], parts = key.split(':');
    if(parts[0]==='s'){
      const su = userById(parts[1]);
      if(!su || !(v.role==='admin' || v.id===su.id)) return;
      out.push(commMakeThread(v, key, all, {title:su.name, sub:'Coordinator ↔ Admin', eventId:'', counterpartId:su.id, kind:'staff', canReply:true}));
      return;
    }
    const evId = parts[1]==='general' ? '' : parts[1], ev = evId ? eventById(evId) : null;
    if(evId && !ev) return;
    if(v.role==='staff' && !(ev && commCanAccessEvent(v, ev))) return;
    if(!all.some(m=>m.senderRole==='participant' || m.direct)) return;
    const pu = userById(parts[2]); if(!pu) return;
    const reg = ev ? DB.regs.find(r=>r.eventId===evId && r.userId===pu.id) : null;
    out.push(commMakeThread(v, key, all, {title:pu.name+(reg&&reg.teamName?' · '+reg.teamName:''), sub:ev?ev.name:'General', eventId:evId, counterpartId:pu.id, kind:'participant', canReply:!!ev}));
  });
  return out.sort(commByLast);
}
function commMarkRead(v, th){
  let changed = false;
  th.all.forEach(m=>{ if(m.recipientId===v.id && m.status!=='read'){ m.status = 'read'; m.readAt = nowISO(); changed = true; } });
  if(changed){ save(); th.unread = 0; }
}
function commBubble(m, v){
  const sys = m.senderRole==='system', mine = m.senderId===v.id, sender = sys ? null : userById(m.senderId);
  const ticks = mine ? (commBatchRead(m) ? '✓✓ Read' : '✓ Delivered') : '';
  return `<div class="msg ${sys?'sys':mine?'mine':'theirs'}">
    ${sys ? `<div class="msg-who">Automatic message</div>` : (mine ? '' : `<div class="msg-who">${esc(sender?sender.name:'Removed user')}<span>${commRoleLabel(m.senderRole)}</span></div>`)}
    ${m.subject ? `<div class="msg-sub">${esc(m.subject)}</div>` : ''}
    ${m.body ? `<div class="msg-text">${esc(m.body)}</div>` : ''}
    ${m.files && m.files.length ? `<div class="file-row">${commFileChips(m.files,'download')}</div>` : ''}
    <div class="msg-meta">${fmtDate(m.createdAt)} · ${fmtTime(m.createdAt)}${ticks ? ' · '+ticks : ''}</div>
  </div>`;
}
function commPaintInbox(root, v){
  let threads = v.role==='participant' ? commParticipantThreads(v) : commOrganizerThreads(v);
  if(v.role!=='participant' && COMM_CTX.eventId) threads = threads.filter(t=>t.eventId===COMM_CTX.eventId);
  if(!threads.length){
    root.innerHTML = `<div class="card">${v.role==='participant'
      ? emptyState('💬','No conversations yet','Register for an event to receive updates and message its organizers here.')
      : emptyState('💬','Inbox is empty','Replies from participants show up here. Use Compose to start a conversation.')}</div>`;
    return;
  }
  if(!threads.some(t=>t.key===CU.thread)){
    CU.thread = (threads.find(t=>t.unread>0) || threads[0]).key; CU.reply = ''; CU.replyFiles = [];
  }
  const th = threads.find(t=>t.key===CU.thread);
  commMarkRead(v, th);
  if(v.role!=='participant'){
    const tabEl = document.querySelector('[data-ctab="inbox"]');
    if(tabEl){ const n = commUnread(v, COMM_CTX.eventId); tabEl.textContent = 'Inbox'+(n?' ('+n+')':''); }
  }
  root.innerHTML = `<div class="inbox">
    <div class="inbox-list">${threads.map(t=>`
      <div class="th-item ${t.key===th.key?'active':''}" data-thread="${esc(t.key)}">
        <div class="th-top"><span class="th-title">${esc(t.title)}</span>${t.unread ? `<span class="th-unread">${t.unread}</span>` : (t.last ? `<span class="tl-sub">${fmtDate(t.last.createdAt)}</span>` : '')}</div>
        <div class="tl-sub">${esc(t.sub)}</div>
        <div class="th-snip">${t.last ? esc(commSnippet(t.last)) : 'No messages yet'}</div>
      </div>`).join('')}</div>
    <div class="inbox-pane">
      <div class="pane-head"><b>${esc(th.title)}</b><div class="tl-sub">${esc(th.sub)}</div></div>
      <div class="pane-body" id="paneBody">${th.msgs.length ? th.msgs.map(m=>commBubble(m, v)).join('') : `<div class="tl-sub" style="margin:auto;text-align:center;">No messages yet.${th.canReply?' Send the first one below.':''}</div>`}</div>
      ${th.canReply ? `<div class="pane-reply">
        <textarea id="replyText" rows="2" placeholder="Write a message… (Enter to send, Shift+Enter for a new line)">${esc(CU.reply)}</textarea>
        <div class="file-row" id="replyFiles">${commFileChips(CU.replyFiles,'remove')}</div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <label class="btn btn-ghost btn-sm" style="margin:0;cursor:pointer;">📎 Attach<input type="file" id="replyFile" multiple accept="${COMM_ACCEPT}" style="display:none;"></label>
          <button class="btn btn-primary btn-sm" id="replySend" type="button">Send</button>
        </div></div>` : `<div class="pane-reply tl-sub">This is a one-way channel. Open an event conversation to reply to its organizers.</div>`}
    </div></div>`;
  const pb = root.querySelector('#paneBody'); if(pb) pb.scrollTop = pb.scrollHeight;
  root.querySelectorAll('[data-thread]').forEach(el=>el.addEventListener('click', ()=>{ CU.thread = el.dataset.thread; CU.reply = ''; CU.replyFiles = []; commPaint(); }));
  if(!th.canReply){ commRefreshBadge(); return; }
  const ta = root.querySelector('#replyText');
  ta.addEventListener('input', ()=>{ CU.reply = ta.value; });
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); commSendReply(v, th); } });
  root.querySelector('#replySend').addEventListener('click', ()=> commSendReply(v, th));
  root.querySelector('#replyFile').addEventListener('change', async e=>{
    commAddFiles(CU.replyFiles, await commReadFiles(e.target.files)); commPaint();
  });
  root.querySelectorAll('[data-rmfile]').forEach(b=>b.addEventListener('click', ()=>{ CU.replyFiles.splice(parseInt(b.dataset.rmfile,10),1); commPaint(); }));
}
function commSendReply(v, th){
  const text = CU.reply.trim();
  if(!text && !CU.replyFiles.length){ toast('Write a message or attach a file.', 'err'); return; }
  let recipients;
  if(v.role==='participant') recipients = commOrganizersOf(eventById(th.eventId)).map(u=>u.id);
  else if(th.kind==='staff') recipients = v.role==='admin' ? [th.counterpartId] : DB.users.filter(u=>u.role==='admin').map(u=>u.id);
  else recipients = [th.counterpartId];
  const res = commSend({sender:v, eventId:th.eventId, recipientIds:recipients, body:text, files:CU.replyFiles, kind:'reply', direct:true, threadKey:th.threadKey});
  if(!res.ok){ toast(res.error, 'err'); return; }
  CU.reply = ''; CU.replyFiles = [];
  commPaint();
  const ta = document.getElementById('replyText'); if(ta) ta.focus();
}

<script>
(function(){
  var canvas = document.getElementById('bg-particles');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, DPR;
  var particles = [];
  var COUNT = 70;
  var LINK_DIST = 130;
  var colors = ['76,224,198', '167,139,250', '245,184,91', '87,209,139'];

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.floor(window.innerWidth * DPR);
    H = canvas.height = Math.floor(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }

  function makeParticles(){
    particles = [];
    for(var i=0;i<COUNT;i++){
      particles.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vx: (Math.random()-0.5) * 0.35 * DPR,
        vy: (Math.random()-0.5) * 0.35 * DPR,
        r: (Math.random()*1.6 + 0.8) * DPR,
        c: colors[Math.floor(Math.random()*colors.length)],
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function step(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.tw += 0.02;
      if(p.x < -20) p.x = W+20; if(p.x > W+20) p.x = -20;
      if(p.y < -20) p.y = H+20; if(p.y > H+20) p.y = -20;
    }
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var a = particles[i], b = particles[j];
        var dx = a.x-b.x, dy = a.y-b.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        var maxDist = LINK_DIST * DPR;
        if(dist < maxDist){
          var alpha = (1 - dist/maxDist) * 0.16;
          ctx.strokeStyle = 'rgba(76,224,198,'+alpha+')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x,a.y);
          ctx.lineTo(b.x,b.y);
          ctx.stroke();
        }
      }
    }
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      var glow = 0.55 + 0.45*Math.sin(p.tw);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r*2.2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+p.c+','+(0.08*glow)+')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba('+p.c+','+(0.85*glow)+')';
      ctx.fill();
    }
    if(!reduceMotion) requestAnimationFrame(step);
  }

  resize();
  makeParticles();
  step();
  if(!reduceMotion){
    window.addEventListener('resize', function(){
      resize();
      makeParticles();
    });
  }
})();
</script>
